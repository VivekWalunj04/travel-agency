services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travel-agency-api
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      PORT: 5000
      CLIENT_URL: http://localhost:3000
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: travel-agency-client
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000
    depends_on:
      - api
    restart: unless-stopped